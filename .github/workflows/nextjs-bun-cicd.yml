name: Deploy to Vercel with Bun

on:
  push:
    branches: [deploy]
  pull_request:
    types:
      - closed
    branches: [deploy]

jobs:
  deploy:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}" >> .env
          echo "NEXT_PUBLIC_SOCKET_CHAT_URL=${{ secrets.NEXT_PUBLIC_SOCKET_CHAT_URL }}" >> .env
          echo "NEXT_PUBLIC_SOCKET_NOTIFICATION_URL=${{ secrets.NEXT_PUBLIC_SOCKET_NOTIFICATION_URL }}" >> .env

      - name: Build Next.js app with Bun
        run: bun run build

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --token $VERCEL_TOKEN --confirm
